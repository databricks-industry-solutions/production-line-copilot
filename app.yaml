command: ['bash', './scripts/start-app.sh']
# ─────────────────────────────────────────────────────────────────────────
# PUBLIC TEMPLATE — you normally do NOT edit this file directly.
# Fill your values ONCE in config/project-settings.local.yaml; scripts/deploy.sh
# derives the shared env below into a gitignored app.local.yaml at deploy time
# (it copies the .local.yaml over this file before `bundle deploy` + `apps
# deploy`, then restores this committed template on exit):
#   * UC_CATALOG, UC_SCHEMA, PGHOST, LAKEBASE_ENDPOINT, SIM_SHIFT_ID, GENIE_SPACE_ID
#     ← rendered from project-settings by scripts/render_app_yaml.py
#   * OPS_*_JOB_ID / OPS_DATA_QUALITY_DASHBOARD_ID
#     ← refreshed from `bundle summary` by scripts/refresh_app_yaml_ids.py
#   * PGUSER / app SP ← resolved at runtime from the injected DATABRICKS_CLIENT_ID
# Values here ship as `SET_ME` placeholders only as a fallback.
# ─────────────────────────────────────────────────────────────────────────
env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  # PROD profile — must match config/project-settings.yaml::line_manager_prod.
  - name: UC_CATALOG
    value: 'SET_ME'
  - name: UC_SCHEMA
    value: 'line_manager_streaming'
  # Does THIS environment write the governed MVM tables? They are catalog-level
  # with no environment suffix, so two environments sharing a catalog share one
  # governed model; the Reconciliation panel only claims those rows when this
  # environment's streaming-silver writer is the one filling them. Rendered from
  # project-settings::mvm_silver_enabled.
  - name: MVM_SILVER_ENABLED
    value: '0'
  - name: AGENT_PORT
    value: '8001'
  # Fallback LLM tiers (rendered from project-settings model_*_endpoint keys by
  # scripts/render_app_yaml.py). Each agent role prefers a vendor-specific model
  # — see agent_server/model_roster.py — and lands on one of these only when the
  # preferred model isn't served in this workspace. Set MODEL_MULTI_VENDOR to 0
  # to ignore the roster and run everything on these two.
  - name: MODEL_SPECIALIST
    value: 'databricks-gpt-5-mini'
  - name: MODEL_ADVANCED
    value: 'databricks-gpt-5'
  - name: MODEL_MULTI_VENDOR
    value: '1'
  - name: MLFLOW_TRACKING_URI
    value: 'databricks'
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: experiment
  # Prod Genie space — targets line_manager_streaming schema.
  - name: GENIE_SPACE_ID
    value: 'SET_ME'
  # Per-domain governed Genie spaces. Each specialist is handed only its own
  # domain; an empty value means that specialist falls back to sql_query.
  - name: GENIE_SPACE_ASSET
    value: ''
  - name: GENIE_SPACE_QUALITY
    value: ''
  - name: GENIE_SPACE_INVENTORY
    value: ''
  - name: GENIE_SPACE_PRODUCTION
    value: ''
  - name: PGHOST
    value: 'SET_ME'
  - name: PGPORT
    value: '5432'
  - name: PGDATABASE
    value: 'databricks_postgres'
  - name: PGSSLMODE
    value: 'require'
  # PROD app SP — captured from `databricks apps get <app-name>` after the
  # first bundle deploy created the app resource.
  - name: PGUSER
    value: 'SET_ME'
  - name: LAKEBASE_ENDPOINT
    value: 'projects/<your-lakebase-project>/branches/production/endpoints/primary'
  - name: SIM_TICK_SECONDS
    value: '1'
  # SSE source — reads ai_serving.*_history via Lakebase playback cursor.
  - name: SSE_SOURCE
    value: 'lakebase'
  - name: SSE_USE_AI_SERVING_ONLY
    value: 'true'
  # Synced-table layout — used when SSE_SOURCE=lakebase_autoscale.
  - name: PG_AUTOSCALE_SCHEMA
    value: 'line_manager_streaming'
  - name: PG_AUTOSCALE_TABLE_SUFFIX
    value: '_synced'
  - name: ZEROBUS_INGEST_ENABLED
    value: 'true'
  - name: OPS_DEFAULT_ROLE
    value: 'viewer'
  - name: OPS_ADMIN_EMAILS
    value: '${DEPLOYER_EMAIL}'
  - name: OPS_DEFAULT_USER
    value: '${DEPLOYER_EMAIL}'
  # Resource IDs aligned with the current bundle deploy
  # (refreshed by scripts/refresh_app_yaml_ids.py from `bundle summary`).
  - name: OPS_PRODUCER_JOB_ID
    value: 'SET_ME'
  - name: OPS_SETUP_JOB_ID
    value: 'SET_ME'
  - name: OPS_DLT_PIPELINE_ID
    value: 'SET_ME'
  # Streaming QC + Dual-Write job (replaces the legacy lakebase_syncer). Used
  # by the Cost & Obs tab to label the line ON/IDLE and amortise its hourly
  # rate. The env-var name is kept for backwards compat; the resource is the
  # streaming_quality_sync bundle job.
  - name: OPS_LAKEBASE_SYNCER_JOB_ID
    value: 'SET_ME'
  # Daily TTL cleanup job for ai_serving.*_history (runs at 03:00 UTC).
  - name: OPS_TTL_JOB_ID
    value: 'SET_ME'
  - name: OPS_DATA_QUALITY_DASHBOARD_ID
    value: 'SET_ME'
  - name: SIM_SHIFT_ID
    value: 'shift_1'
  - name: SSE_POLL_SECONDS
    value: '1.0'
  # Cursor backfill on first SSE connect: positions playback at MAX(ts) - N s.
  # 2 s keeps event-log freshness in lockstep with machine_state freshness so
  # incident triggers feel reactive (FILLER turns red within ~4-5 s of click,
  # matching when its event_log entry appears). Trade-off: slightly more
  # "Live · waiting" pill flicker during transient streaming-sync slowdowns.
  # Cached-frame logic in the SSE generator keeps panels populated through
  # short gaps. Cursor auto-snaps forward when lag > buffer*2+2s (see
  # /serving/stream loop) so a hiccup never strands the cursor permanently.
  - name: SSE_BUFFER_SECONDS
    value: '2'
  # Vector Search endpoint for retrieve_similar_cases. DERIVED — set
  # `vector_search_endpoint` in config/project-settings(.local).yaml and
  # render_app_yaml.py writes both this and the billing flag below into the
  # gitignored app.<env>.local.yaml that actually ships. Editing it here works
  # for a one-off, but the next deploy overwrites it.
  #
  # Empty means the tool uses keyword retrieval instead of paying a failed
  # round-trip to an index that is not there. Enabling it costs 15-40 minutes on
  # the deploy that first creates the endpoint; see the settings file.
  - name: VS_ENDPOINT
    value: ''
  # Vector Search endpoint hourly billing toggle. A live endpoint bills hourly
  # whether queries hit it or not, so the cost panel must charge for it even at
  # 0 queries. Keep this 'false' while VS_ENDPOINT above is empty — otherwise
  # the panel invents roughly $58/month for infrastructure nobody provisioned.
  - name: OPS_VS_ENDPOINT_ALWAYS_ON
    value: 'false'
  # Knowledge Assistant serving endpoint behind query_plant_docs, the tool that
  # answers from the plant documents in data/plant_docs/. DERIVED — set
  # `knowledge_assistant_name` in config/project-settings(.local).yaml and the
  # deploy provisions the assistant, then writes this and the id below back the
  # same way VS_ENDPOINT above is written.
  #
  # Empty means the tool reports itself unconfigured, which is the point: a
  # specialist that answers a procedure question without reading the procedure is
  # worse than one that says the documents were not available. Enabling it costs
  # an agent endpoint that bills while it is online.
  - name: DOCS_KA_ENDPOINT
    value: ''
  # Carried only so the app can name the assistant it is talking to; the tool
  # queries DOCS_KA_ENDPOINT above.
  - name: DOCS_KA_ID
    value: ''
