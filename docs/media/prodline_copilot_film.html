    <script>
      document.addEventListener('DOMContentLoaded', async function () {
        const loading = document.getElementById('__bundler_loading');
        function setStatus(msg) {
          if (loading) loading.textContent = msg;
        }

        // Error sink persists across replaceWith since it's on window, not the DOM.
        window.addEventListener(
          'error',
          function (e) {
            var p = document.body || document.documentElement;
            var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
            d.id = '__bundler_err';
            d.style.cssText =
              'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
            d.textContent =
              (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
              '[bundle] ' +
              (e.message || e.type) +
              (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
          },
          true
        );

        try {
          const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
          const templateEl = document.querySelector('script[type="__bundler/template"]');
          if (!manifestEl || !templateEl) {
            setStatus('Error: missing bundle data');
            console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
            return;
          }

          const manifest = JSON.parse(manifestEl.textContent);
          let template = JSON.parse(templateEl.textContent);

          const uuids = Object.keys(manifest);
          setStatus('Unpacking ' + uuids.length + ' assets...');

          const blobUrls = {};
          await Promise.all(
            uuids.map(async (uuid) => {
              const entry = manifest[uuid];
              try {
                const binaryStr = atob(entry.data);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

                let finalBytes = bytes;
                if (entry.compressed) {
                  if (typeof DecompressionStream !== 'undefined') {
                    const ds = new DecompressionStream('gzip');
                    const writer = ds.writable.getWriter();
                    const reader = ds.readable.getReader();
                    writer.write(bytes);
                    writer.close();
                    const chunks = [];
                    let totalLen = 0;
                    while (true) {
                      const { done, value } = await reader.read();
                      if (done) break;
                      chunks.push(value);
                      totalLen += value.length;
                    }
                    finalBytes = new Uint8Array(totalLen);
                    let offset = 0;
                    for (const chunk of chunks) {
                      finalBytes.set(chunk, offset);
                      offset += chunk.length;
                    }
                  } else {
                    console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
                  }
                }

                blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
              } catch (err) {
                console.error('Failed to decode asset ' + uuid + ':', err);
                blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
              }
            })
          );

          const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
          const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
          const resourceMap = {};
          for (const entry of extResources) {
            if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
          }

          setStatus('Rendering...');
          for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

          // Strip integrity + crossorigin — blob URLs from a file:// document inherit
          // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
          // The manifest bytes are ours; SRI protects against CDN compromise, not this.
          template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

          const resourceScript =
            '<script>window.__resources = ' +
            JSON.stringify(resourceMap)
              .split('</' + 'script>')
              .join('<\\/' + 'script>') +
            ';</' +
            'script>';
          // Inject after <head> so the DOCTYPE stays first; prepending the script
          // would push the parser into quirks mode. DOMParser always emits a <head>
          // (synthesizing one if the source HTML omitted it) but may carry
          // attributes through, so match the full opening tag. slice() rather than
          // replace() keeps us clear of $-pattern substitution in resourceScript.
          const headOpen = template.match(/<head[^>]*>/i);
          if (headOpen) {
            const i = headOpen.index + headOpen[0].length;
            template = template.slice(0, i) + resourceScript + template.slice(i);
          }

          // Parse the template and swap the root element. Scripts inserted via
          // DOMParser/replaceWith are inert per spec — re-create each with
          // createElement so they execute, awaiting onload for src scripts to
          // preserve ordering (React before ReactDOM before Babel before text/babel).
          const doc = new DOMParser().parseFromString(template, 'text/html');
          document.documentElement.replaceWith(doc.documentElement);
          const dead = Array.from(document.scripts);
          for (const old of dead) {
            const s = document.createElement('script');
            for (const a of old.attributes) s.setAttribute(a.name, a.value);
            s.textContent = old.textContent;
            // text/babel scripts with a src: fetch and inline. transformScriptTags
            // does XHR against the src, but blob:null/ from a file:// origin is
            // silently dropped. Inlining makes it a plain inline babel script,
            // which transformScriptTags handles unconditionally.
            if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
              const r = await fetch(s.src);
              s.textContent = await r.text();
              s.removeAttribute('src');
            }
            const p = s.src
              ? new Promise(function (r) {
                  s.onload = s.onerror = r;
                })
              : null;
            old.replaceWith(s);
            if (p) await p;
          }
          // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
          // which fired before we swapped the document. Trigger manually if present.
          if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
            window.Babel.transformScriptTags();
          }
          // Inject synchronized voice-over after the film app mounts.
          (function loadVoiceover() {
            const s = document.createElement('script');
            s.src = new URL('prodline_copilot_film_vo/player.js', window.location.href).href;
            s.async = true;
            document.head.appendChild(s);
          })();
        } catch (err) {
          setStatus('Error unpacking: ' + err.message);
          console.error('Bundle unpack error:', err);
        }
      });
    </script>

backgrounds */\n  --db-navy-700:    #1B5162; /* deep teal-navy accent */\n  --db-lava:        #FF3621; /* iconic Databricks orange/red — primary accent, links */\n  --db-coral:       #FF5F46; /* softer orange — slide accent, product icons */\n  --db-oat-light:   #F9F7F4; /* primary warm background (\"warm-gray\") */\n  --db-oat-medium:  #EEEDE9; /* secondary warm bg / hairline borders */\n  --db-white:       #FFFFFF;\n\n  /* ============ INK / TEXT ============ */\n  --db-ink:         #3A3838; /* body text — warm near-black (dominant in template) */\n  --db-ink-soft:    #5A5755; /* secondary text */\n  --db-ink-muted:   #8A8580; /* tertiary / captions */\n  --db-black:       #000000;\n\n  /* ============ EXTENDED ACCENTS ============ */\n  --db-green:       #00A972; /* success / positive */\n  --db-green-700:   #00875C;\n  --db-amber:       #FFAB00; /* warning / highlight */\n  --db-gold:        #FCBA33;\n  --db-maroon:      #98102A; /* deep red / error-dark */\n  --db-red:         #BD2B26;\n  --db-slate:       #618794; /* slate blue — charts, muted accent */\n  --db-blue:        #4359FF; /* electric blue — data viz */\n  --db-teal:        #42BA91;\n\n  /* ============ CHART / DATA-VIZ TINTS ============ */\n  --db-tint-coral:  #FF9E94;\n  --db-tint-rose:   #FABFBA;\n  --db-tint-gold:   #FFCC66;\n  --db-tint-amber:  #FFDB96;\n  --db-tint-green:  #9ED6C4;\n  --db-tint-teal:   #70C4AB;\n  --db-tint-mauve:  #BF7080;\n  --db-tint-pink:   #D69EA8;\n\n  /* ============ NEUTRAL / UI GRAYS ============ */\n  --db-gray-100:    #F8F9FA;\n  --db-gray-200:    #EEEDE9;\n  --db-gray-300:    #C4CCD6;\n  --db-gray-400:    #A0ACBE;\n  --db-line:        #E4E2DD; /* warm hairline on oat */\n\n  /* ============ SURFACES ============ */\n  --db-bg:          var(--db-oat-light);\n  --db-surface:     #FFFFFF;\n  --db-surface-alt: var(--db-oat-medium);\n  --db-surface-dark:var(--db-navy);\n\n  /* ============ TYPE FAMILIES ============ */\n  --font-sans:    'DM Sans', system-ui, -apple-system, sans-serif;\n  --font-display: 'Barlow', 'DM Sans', system-ui, sans-serif;\n  --font-mono:    'DM Mono', ui-monospace, 'SF Mono', Menlo, monospace;\n\n  /* ============ TYPE SCALE ============ (multiples of 8; 12 & 20 in-between) */\n  --fs-12: 12px;\n  --fs-16: 16px;\n  --fs-20: 20px;\n  --fs-24: 24px;\n  --fs-32: 32px;\n  --fs-40: 40px;\n  --fs-56: 56px;\n  --fs-64: 64px;\n\n  /* ============ WEIGHTS ============ */\n  --fw-regular: 400; /* @kind font */\n  --fw-medium:  500; /* @kind font */\n  --fw-bold:    700; /* @kind font */\n\n  /* ============ LINE HEIGHTS ============ */\n  --lh-tight:   1.05; /* @kind font */\n  --lh-snug:    1.2;  /* @kind font */\n  --lh-normal:  1.4;  /* @kind font */\n  --lh-relaxed: 1.6;  /* @kind font */\n\n  /* ============ SPACING (8px base grid) ============ */\n  --sp-1: 4px;\n  --sp-2: 8px;\n  --sp-3: 12px;\n  --sp-4: 16px;\n  --sp-5: 24px;\n  --sp-6: 32px;\n  --sp-7: 48px;\n  --sp-8: 64px;\n  --sp-9: 96px;\n\n  /* ============ RADII ============ (Databricks uses minimal rounding) */\n  --r-sm: 4px;\n  --r-md: 8px;\n  --r-lg: 12px;\n  --r-pill: 999px;\n\n  /* ============ SHADOWS ============ (soft, warm, low-spread) */\n  --shadow-sm: 0 1px 2px rgba(27, 49, 57, 0.06), 0 1px 3px rgba(27, 49, 57, 0.08);\n  --shadow-md: 0 2px 6px rgba(27, 49, 57, 0.08), 0 8px 20px rgba(27, 49, 57, 0.08);\n  --shadow-lg: 0 8px 24px rgba(27, 49, 57, 0.10), 0 24px 48px rgba(27, 49, 57, 0.10);\n}\n\n/* ============================================================\n   SEMANTIC TYPOGRAPHY\n   ============================================================ */\n.db-display {\n  font-family: var(--font-display);\n  font-size: var(--fs-64);\n  font-weight: var(--fw-medium);\n  line-height: var(--lh-tight);\n  letter-spacing: -0.02em;\n  color: var(--db-navy);\n}\n.db-h1 {\n  font-family: var(--font-sans);\n  font-size: var(--fs-56);\n  font-weight: var(--fw-bold);\n  line-height: var(--lh-tight);\n  letter-spacing: -0.02em;\n  color: var(--db-navy);\n}\n.db-h2 {\n  font-family: var(--font-sans);\n  font-size: var(--fs-40);\n  font-weight: var(--fw-bold);\n  line-height: var(--lh-snug);\n  letter-spacing: -0.015em;\n  color: var(--db-navy);\n}\n.db-h3 {\n  font-family: var(--font-sans);\n  font-size: var(--fs-32);\n  font-weight: var(--fw-medium);\n  line-height: var(--lh-snug);\n  letter-spacing: -0.01em;\n  color: var(--db-navy);\n}\n.db-h4 {\n  font-family: var(--font-sans);\n  font-size: var(--fs-24);\n  font-weight: var(--fw-medium);\n  line-height: var(--lh-snug);\n  color: var(--db-navy);\n}\n.db-subtitle {\n  font-family: var(--font-sans);\n  font-size: var(--fs-20);\n  font-weight: var(--fw-regular);\n  line-height: var(--lh-normal);\n  color: var(--db-ink-soft);\n}\n.db-body {\n  font-family: var(--font-sans);\n  font-size: var(--fs-16);\n  font-weight: var(--fw-regular);\n  line-height: var(--lh-relaxed);\n  color: var(--db-ink);\n}\n.db-caption {\n  font-family: var(--font-sans);\n  font-size: var(--fs-12);\n  font-weight: var(--fw-medium);\n  line-height: var(--lh-normal);\n  letter-spacing: 0.02em;\n  color: var(--db-ink-muted);\n}\n.db-eyebrow {\n  font-family: var(--font-sans);\n  font-size: var(--fs-12);\n  font-weight: var(--fw-bold);\n  line-height: var(--lh-normal);\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--db-lava);\n}\n.db-code {\n  font-family: var(--font-mono);\n  font-size: var(--fs-16);\n  font-weight: var(--fw-regular);\n  line-height: var(--lh-relaxed);\n  color: var(--db-ink);\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div data-screen-label=\"00:00\" style=\"position:fixed; inset:0; width:100vw; height:100vh; background:#0a0a0a;\">\n  <x-import component=\"Movie\" from=\"933fab98-f06c-4b3d-be81-0c9cc5232254#/animations.bundle.jsx\" accent=\"lava\" supervisor-name=\"Maya\" playback-speed=\"1\" show-clock=\"true\" hint-size=\"100%,100%\"><\u002Fx-import>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
