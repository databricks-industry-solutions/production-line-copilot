# DQX (Databricks Labs Data Quality eXtended) rule definitions for the
# streaming_quality_sync job. Loaded by ``pipelines.dqx_augment.load_checks``
# and applied via ``DQEngine.apply_checks_by_metadata`` in WARNING mode so
# rows are flagged but not dropped (the existing hand-rolled ``QC_RULES``
# in streaming_quality_sync.py continues to own the drop decision).
#
# Coverage split, deliberate:
#   * Null / enum / range / non-negative on primary keys → QC_RULES
#     (already implemented; well-covered by SQL predicates).
#   * Freshness (row is older than SLA) → DQX (built-in ``is_older_than_n_seconds``)
#   * Cross-table referential → DQX (built-in ``foreign_key``), reserved
#     for after step 3 lands the Industry Data Model silver layer with
#     ``equipment_register``. Do not enable until then — foreign_key against
#     a nonexistent table just no-ops with a WARN log.
#   * Non-negative throughput → DQX (missing from QC_RULES today for
#     line_kpi.throughput_per_min).
#
# Naming: ``<table>__<check>`` so the DQ dashboard can group by prefix.

checks:
  # machine_state — freshness
  # Bronze row's ts (event time) must be within 60 s of processing time.
  # Rows older than 60 s indicate producer lag, Zerobus backup, or a stalled
  # driver. Threshold matches the "Live · waiting for new value" gap the SSE
  # cursor treats as user-visible latency.
  - criticality: warn
    check:
      function: is_not_null_and_not_empty
      arguments:
        column: ts
    name: machine_state__ts_present
    filter: 'true'

  # Freshness. DQX >=0.15 replaced the removed ``is_older_than_n_seconds``
  # with ``is_data_fresh`` (minute granularity). Threshold is 5 min, NOT 60 s:
  # this analytics path drains via ``availableNow`` on a ~60 s cycle, so rows
  # are inherently 30-90 s old when processed — a 60 s SLA would flag virtually
  # every healthy row. 5 min catches genuine producer stalls / Zerobus backups
  # without false positives. (Live-UI latency is owned by the producer's direct
  # Lakebase dual-write, not this job.) Renamed stale_60s -> stale_5m.
  - criticality: warn
    check:
      function: is_data_fresh
      arguments:
        column: ts
        max_age_minutes: 5
    name: machine_state__stale_5m
    filter: 'true'

  # line_kpi — throughput must be non-negative.
  # Column is ``total_throughput`` on line_kpi_bronze (NOT throughput_per_min,
  # which lives on machine_state). A wrong column name makes DQX skip the check
  # with an "invalid check columns" meta-warning rather than evaluating it.
  - criticality: warn
    check:
      function: is_not_less_than
      arguments:
        column: total_throughput
        limit: 0
    name: line_kpi__throughput_non_negative
    filter: 'true'

  # line_kpi — OEE plausible range.
  # Column is ``oee_to_now`` (running OEE). The producer ships this as a
  # PERCENTAGE (0..100), same as availability/performance/quality_to_now — not
  # a 0..1 fraction. The check bounds must match: a value <0 or >100 indicates a
  # real producer bug. (Name kept ``_in_unit_range`` for dashboard continuity.)
  - criticality: warn
    check:
      function: is_in_range
      arguments:
        column: oee_to_now
        min_limit: 0
        max_limit: 100
    name: line_kpi__oee_in_unit_range
    filter: 'true'

  # ── Referential integrity against the Industry Data Model silver layer ──
  # Enabled once the Manufacturing MVM is installed (notebook 06) and the
  # silver mapper (notebook 07) populates ``asset.equipment_register`` — its
  # ``asset_number`` column carries the simulator's ``machine_id``. The
  # ``${MVM_CATALOG}`` token is substituted at load time by
  # ``dqx_augment.load_checks`` (default ``line_manager_silver_mvm``). If the
  # MVM catalog/table is absent, DQX logs a WARN and skips the check, so this
  # is safe to ship enabled.
  - criticality: warn
    check:
      function: foreign_key
      arguments:
        columns: [machine_id]
        ref_columns: [asset_number]
        ref_table: ${MVM_CATALOG}.asset.equipment_register
    name: machine_state__machine_id_referential
    filter: 'true'
