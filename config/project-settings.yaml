# Project UC / workspace settings (single place to edit for your environments).
# Run:  python scripts/sync_project_settings.py
# to regenerate config/bundle-targets.yaml for Databricks Asset Bundles.
#
# ─────────────────────────────────────────────────────────────────────────────
#  PUBLIC TEMPLATE — fill values in config/project-settings.local.yaml
#
#  This committed file ships with `SET_ME` / `<your-*>` placeholders for every
#  workspace-specific value. The deploy pipeline (scripts/deploy.sh,
#  scripts/sync_project_settings.py, scripts/refresh_app_yaml_ids.py) prefers
#  config/project-settings.local.yaml when present — that file is gitignored,
#  so your real workspace hosts, SP UUIDs, and Lakebase endpoints never land
#  in version control.
#
#  Bootstrap a new environment:
#    cp config/project-settings.yaml config/project-settings.local.yaml
#    # …edit the .local.yaml to point at your workspace…
#    ./scripts/deploy.sh dev
#
#  Required per profile you intend to deploy:
#    - workspace_host
#    - sql_warehouse_id
#    - uc_catalog / uc_schema  (catalogs you own; setup job will populate them)
#    - producer_client_id / app_client_id (service principals)
#    - lakebase_pg_host / lakebase_endpoint / lakebase_pg_user
#    - zerobus_server_endpoint (region-specific Zerobus URL)
#
#  ${DEPLOYER_EMAIL} is auto-substituted by sync_project_settings.py from
#  `databricks current-user me` (override with DEPLOYER_EMAIL env var).
# ─────────────────────────────────────────────────────────────────────────────
#
# Unity Catalog: catalog + schema are the live streaming target unless noted.
# src_* : reference tables copied by bootstrap_reference_data into uc_*.
#
# zerobus_ingest_enabled — drives bundle resources (see docs/solution-accelerator/DEPLOY.md):
#   true  → setup job + Zerobus streaming producer job + streaming_quality_sync job. REQUIRED
#           for a live dashboard: the producer is the sole writer of live telemetry (Producer →
#           Zerobus → bronze → streaming sync → Lakebase ai_serving.* → App SSE).
#   false → UC setup job only; no live data plane (there is no in-app simulation engine). Use
#           only for a schema/reference-data-only deploy.

version: 1

profiles:
  line_manager_prod:
    description: 'Prod streaming workspace (streaming + producer + quality-gate)'
    zerobus_ingest_enabled: true
    bundle_target: line_manager_prod
    workspace_host: 'https://<your-workspace>.cloud.databricks.com'
    sql_warehouse_id: 'SET_ME'
    # Databricks App *resource* name (per-env). Intentionally distinct from the
    # package slug `productionline-copilot` (package.json / repo) — the deployed
    # app carries an environment suffix. Rename freely for your own workspace.
    app_name: 'production-line-copilot-prod'
    uc_catalog: 'SET_ME'
    uc_schema: 'line_manager_streaming'
    sim_shift_id: 'shift_1'
    # Empty → the setup job GENERATES reference data in-workspace (recommended;
    # no external seed needed). Set both to copy dimension tables from an
    # existing seed schema instead (e.g. "main" / "line_manager_ai_kit").
    src_catalog: ''
    src_schema: ''
    # Manufacturing Industry Data Model (MVM) silver catalog. Empty → falls back
    # to uc_catalog (installing a NEW catalog needs metastore CREATE CATALOG,
    # which many workspaces deny). Installed once by the setup job; fact tables
    # are then kept fresh by the streaming job's per-micro-batch MERGE (see
    # mvm_silver_enabled). Read by the DQX referential check + Genie/SQL analytics.
    mvm_catalog: ''
    # "true" enables DQX (freshness/range/referential checks → dqx_warnings +
    # DQ dashboard) on this target's streaming_quality_sync job. Ships OFF.
    dqx_enabled: false
    # "true" enables streaming silver (design B): the streaming_quality_sync job
    # MERGE-upserts each micro-batch into the MVM fact tables at seconds latency
    # (no separate 30-min batch refresh). Requires mvm_catalog set. Ships OFF.
    mvm_silver_enabled: false
    # Semantic retrieval for retrieve_similar_cases (the downtime analyst's
    # "what did we do last time this happened" tool). Ships OFF: empty means
    # that tool ranks past events by keyword overlap, which works and costs
    # nothing.
    #
    # Setting a name here — 'prodline-copilot-vs' is the conventional one — makes
    # deploy.sh create the endpoint and a Delta Sync index over the event
    # history, and points the app at them. Two things to know before you do:
    #
    #   * The FIRST deploy that creates the endpoint takes roughly 15-40 minutes,
    #     most of it waiting on provisioning. Later deploys re-use it and add
    #     seconds. Budget for it or run that first deploy ahead of a demo.
    #   * A Vector Search endpoint bills by the hour once it is online, whether
    #     or not anything queries it. Clear this value to turn it back off.
    vector_search_endpoint: ''
    lakebase_catalog: ''
    lakebase_schema: 'public'
    genie_space_id: 'SET_ME'
    # Separate GOVERNED Genie space over the MVM silver model (asset/production/
    # quality/inventory). Auto-created by deploy.sh only when mvm_silver_enabled
    # is true; leave SET_ME to (re)capture. Distinct from genie_space_id (the
    # live streaming/mobile-briefing space the in-app agent uses).
    mvm_genie_space_id: 'SET_ME'
    # Per-domain governed Genie spaces, one per schema of the MVM model. Each
    # specialist gets only its own domain: asset -> maintenance + downtime,
    # quality -> quality specialist, inventory -> supply chain, production ->
    # OEE + scheduling + strategy. Narrow scope is what keeps Genie accurate,
    # and the boundary is a UC schema so grants can differ per domain.
    # Auto-created by deploy.sh alongside mvm_genie_space_id when
    # mvm_silver_enabled is true; leave SET_ME to (re)capture. A domain left
    # empty just means that specialist falls back to sql_query.
    genie_space_asset: 'SET_ME'
    genie_space_quality: 'SET_ME'
    genie_space_inventory: 'SET_ME'
    genie_space_production: 'SET_ME'
    zerobus_server_endpoint: 'SET_ME'
    producer_client_id: 'SET_ME'
    producer_client_secret_ref: '{{secrets/line-manager/zerobus-client-secret}}'
    app_client_id: 'SET_ME'
    lakebase_pg_host: 'SET_ME'
    lakebase_pg_user: 'SET_ME'
    lakebase_syncer_pg_user: '${DEPLOYER_EMAIL}'
    lakebase_pg_database: 'databricks_postgres'
    lakebase_endpoint: 'projects/<your-lakebase-project>/branches/production/endpoints/primary'
    lakebase_checkpoint_volume: '/Volumes/<your_catalog>/line_manager_streaming/_checkpoints'
    mlflow_experiment_path: '/Shared/production-line-copilot-experiment'
    # Who can READ the MLflow traces, on top of the app's own service principal
    # that writes them. Sharing the app grants none of this: the traces tab
    # deep-links into the workspace MLflow UI and queries the trace tables as
    # whoever clicked, so without a grant here a colleague with CAN_MANAGE on
    # the app opens the traces tab and sees nothing at all.
    #
    # Default (leave unset): 'account users', i.e. everyone. That is the right
    # trade for a demo, where the alternative is a silent empty page. Narrow it
    # if these traces are sensitive — a comma-separated list of groups and/or
    # user emails, or 'none' to grant nobody. See docs/EVALUATION.md ("Who can
    # see the traces") for what this grants.
    # trace_viewers: 'account users'
    # LLM serving endpoints. Each agent role runs on a model picked for its
    # workload, spanning Anthropic, OpenAI, Google, Meta, Alibaba and Zhipu on
    # the Databricks Foundation Model APIs — agent_server/model_roster.py holds
    # the assignments and the reasoning. Nothing here needs editing to get that.
    #
    # These two are the FALLBACK tiers. A role whose preferred model isn't
    # served in your workspace lands on one of them instead, so a workspace
    # missing a vendor still works. Point them at whatever your workspace does
    # serve; preflight.py validates them.
    #   specialist  → fallback for the tactical roles (fast / cheap)
    #   advanced    → fallback for oee_coach + strategic_advisor (deep reasoning)
    model_specialist_endpoint: 'databricks-gpt-5-mini'
    model_advanced_endpoint: 'databricks-gpt-5'
    # Set to false to ignore the roster entirely and run every role on the two
    # tiers above — the single-vendor behaviour shipped before v0.3.
    model_multi_vendor: true
    # Per-role overrides. Uncomment a line to pin one role to a specific
    # endpoint; everything you leave out keeps the roster default. Run
    # ``python3 scripts/preflight.py <env> --models`` to see the defaults and
    # which of them your workspace actually serves. Unknown role names fail the
    # render rather than silently doing nothing.
    # model_roles:
    #   downtime_analyst: 'databricks-claude-sonnet-5'
    #   quality_specialist: 'databricks-glm-5-2'
    #   supply_chain_advisor: 'databricks-llama-4-maverick'
    #   oee_coach: 'databricks-gpt-5-4'
    #   schedule_optimizer: 'databricks-gpt-oss-120b'
    #   maintenance_predictor: 'databricks-qwen35-122b-a10b'
    #   strategic_advisor: 'databricks-claude-opus-5'
    #   shift_briefing: 'databricks-claude-haiku-4-5'
    #   general: 'databricks-gpt-5-mini'
    #   intent_router: 'databricks-gemma-3-12b'
    # Legacy: pins BOTH routing and synthesis to one endpoint. Empty (default)
    # lets the roster pick a model for each.
    model_orchestrator_endpoint: ''

  line_manager_dev:
    description: |
      Dev sibling of line_manager_prod — same workspace, suffixed resource
      names. Two-deployment isolation:
        • Distinct ``sim_shift_id`` (shift_1_dev) keeps dev rows out of
          prod's SSE cursor scan, and vice versa. Lakebase
          ``MAX(ts) WHERE shift_id IN (...)`` cursors won't see the wrong env.
        • Distinct ``uc_schema`` (line_manager_streaming_dev) so the
          producer and quality-gate job write into a dev UC schema and sync
          into Lakebase under the dev-suffixed targets.
        • Distinct ``app_client_id`` (one SP per app) so it needs its own
          UC + Lakebase grants. Producer SP can be reused from prod if you
          only have one.
    zerobus_ingest_enabled: true
    bundle_target: line_manager_dev
    resource_name_suffix: '-dev'
    workspace_host: 'https://<your-workspace>.cloud.databricks.com'
    sql_warehouse_id: 'SET_ME'
    app_name: 'production-line-copilot-dev'
    uc_catalog: 'SET_ME'
    uc_schema: 'line_manager_streaming_dev'
    sim_shift_id: 'shift_1_dev'
    # Empty → the setup job GENERATES reference data in-workspace (recommended;
    # no external seed needed). Set both to copy dimension tables from an
    # existing seed schema instead (e.g. "main" / "line_manager_ai_kit").
    src_catalog: ''
    src_schema: ''
    # Manufacturing Industry Data Model (MVM) silver catalog. Empty → falls back
    # to uc_catalog (installing a NEW catalog needs metastore CREATE CATALOG,
    # which many workspaces deny). Installed once by the setup job; fact tables
    # are then kept fresh by the streaming job's per-micro-batch MERGE (see
    # mvm_silver_enabled). Read by the DQX referential check + Genie/SQL analytics.
    mvm_catalog: ''
    # "true" enables DQX (freshness/range/referential checks → dqx_warnings +
    # DQ dashboard) on this target's streaming_quality_sync job. Ships OFF.
    dqx_enabled: false
    # "true" enables streaming silver (design B): the streaming_quality_sync job
    # MERGE-upserts each micro-batch into the MVM fact tables at seconds latency
    # (no separate 30-min batch refresh). Requires mvm_catalog set. Ships OFF.
    mvm_silver_enabled: false
    # Semantic retrieval for retrieve_similar_cases. See the dev profile above
    # for what setting this costs you: ~15-40 min on the deploy that first
    # creates the endpoint, and hourly billing for as long as it stays online.
    vector_search_endpoint: ''
    lakebase_catalog: ''
    lakebase_schema: 'public'
    genie_space_id: ''
    # Governed MVM Genie space (see note above). Empty by default in this
    # profile; deploy.sh only provisions it when mvm_silver_enabled is true.
    mvm_genie_space_id: ''
    # Per-domain governed Genie spaces — see line_manager_prod above. Captured
    # by deploy.sh when mvm_silver_enabled is true.
    genie_space_asset: ''
    genie_space_quality: ''
    genie_space_inventory: ''
    genie_space_production: ''
    zerobus_server_endpoint: 'SET_ME'
    producer_client_id: 'SET_ME'
    producer_client_secret_ref: '{{secrets/line-manager/zerobus-client-secret}}'
    app_client_id: 'SET_ME'
    lakebase_pg_host: 'SET_ME'
    lakebase_pg_user: 'SET_ME'
    lakebase_syncer_pg_user: '${DEPLOYER_EMAIL}'
    lakebase_pg_database: 'databricks_postgres'
    lakebase_endpoint: 'projects/<your-lakebase-project>/branches/production/endpoints/primary'
    lakebase_checkpoint_volume: '/Volumes/<your_catalog>/line_manager_streaming_dev/_checkpoints'
    mlflow_experiment_path: '/Shared/production-line-copilot-dev-experiment'
    # Who can read the traces; see the prod profile above for what this grants.
    # trace_viewers: 'users'
    # See line_manager_prod above for what these control. Override only if your
    # workspace serves the models under different endpoint names.
    model_specialist_endpoint: 'databricks-gpt-5-mini'
    model_advanced_endpoint: 'databricks-gpt-5'
    model_multi_vendor: true
    # model_roles:  # per-role overrides — see line_manager_prod above
    model_orchestrator_endpoint: ''
