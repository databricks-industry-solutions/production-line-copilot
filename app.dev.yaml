command: ['bash', './scripts/start-app.sh']
# ─────────────────────────────────────────────────────────────────────────
# DEV app config — paired with bundle target `line_manager_dev` (see
# config/project-settings.yaml). Deployed via `./scripts/deploy.sh dev`,
# which copies this file over `app.yaml` before running `databricks apps
# deploy <dev-app-name>` and restores the prod app.yaml on exit.
#
# PUBLIC TEMPLATE — you normally do NOT edit this file directly.
# Fill your values ONCE in config/project-settings.local.yaml; scripts/deploy.sh
# derives the shared env below into a gitignored app.dev.local.yaml at deploy time:
#   * UC_CATALOG, UC_SCHEMA, PGHOST, LAKEBASE_ENDPOINT, SIM_SHIFT_ID, GENIE_SPACE_ID
#     ← rendered from project-settings by scripts/render_app_yaml.py
#   * OPS_* IDs ← refreshed from the bundle by scripts/refresh_app_yaml_ids.py
#   * PGUSER / app SP ← resolved at runtime from the injected DATABRICKS_CLIENT_ID
# Values here ship as `SET_ME` placeholders only as a fallback.
# ─────────────────────────────────────────────────────────────────────────
env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  # DEV — isolated UC schema (dev sibling of line_manager_streaming).
  - name: UC_CATALOG
    value: 'SET_ME'
  - name: UC_SCHEMA
    value: 'line_manager_streaming_dev'
  - name: AGENT_PORT
    value: '8001'
  # LLM serving endpoints (rendered from project-settings model_*_endpoint keys
  # by scripts/render_app_yaml.py). Override in project-settings.local.yaml if
  # your workspace serves the models under different names. MODEL_ORCHESTRATOR
  # follows the specialist endpoint unless you set model_orchestrator_endpoint.
  - name: MODEL_SPECIALIST
    value: 'databricks-gpt-5-mini'
  - name: MODEL_ADVANCED
    value: 'databricks-gpt-5'
  - name: MODEL_ORCHESTRATOR
    value: 'databricks-gpt-5-mini'
  - name: MLFLOW_TRACKING_URI
    value: 'databricks'
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: experiment
  # Auto-provisioned: on a fresh deploy, scripts/deploy.sh creates a dedicated
  # dev Genie space (POST /api/2.0/genie/spaces), grants the app SP CAN_RUN,
  # and writes the id back into project-settings + this env var. Left empty
  # only if you opt out of setup (RUN_SETUP=0). The in-app shift_briefing agent
  # still produces correct briefings without Genie by falling back to context + SQL.
  - name: GENIE_SPACE_ID
    value: ''
  - name: PGHOST
    value: 'SET_ME'
  - name: PGPORT
    value: '5432'
  - name: PGDATABASE
    value: 'databricks_postgres'
  - name: PGSSLMODE
    value: 'require'
  # Dev app SP (different from prod). Lakebase OAuth tokens are SP-bound,
  # so PGUSER must match the SP that the App runs as.
  - name: PGUSER
    value: 'SET_ME'
  - name: LAKEBASE_ENDPOINT
    value: 'projects/<your-lakebase-project>/branches/production/endpoints/primary'
  - name: SIM_TICK_SECONDS
    value: '1'
  - name: SSE_SOURCE
    value: 'lakebase'
  - name: SSE_USE_AI_SERVING_ONLY
    value: 'true'
  - name: PG_AUTOSCALE_SCHEMA
    value: 'line_manager_streaming_dev'
  - name: PG_AUTOSCALE_TABLE_SUFFIX
    value: '_synced'
  - name: ZEROBUS_INGEST_ENABLED
    value: 'true'
  - name: OPS_DEFAULT_ROLE
    value: 'viewer'
  - name: OPS_ADMIN_EMAILS
    value: '${DEPLOYER_EMAIL}'
  - name: OPS_DEFAULT_USER
    value: '${DEPLOYER_EMAIL}'
  # ── Dev resource IDs (refreshed by scripts/refresh_app_yaml_ids.py) ──
  - name: OPS_PRODUCER_JOB_ID
    value: 'SET_ME'
  - name: OPS_SETUP_JOB_ID
    value: 'SET_ME'
  - name: OPS_LAKEBASE_SYNCER_JOB_ID
    value: 'SET_ME'
  - name: OPS_TTL_JOB_ID
    value: 'SET_ME'
  - name: OPS_DATA_QUALITY_DASHBOARD_ID
    value: 'SET_ME'
  # MUST match the dev producer's --shift-id (set in
  # bundle-targets.yaml from project-settings.yaml::line_manager_dev.sim_shift_id).
  # Lakebase ai_serving.*_history is shared with prod, so a unique
  # shift_id is the only thing keeping dev rows out of prod's cursor.
  - name: SIM_SHIFT_ID
    value: 'shift_1_dev'
  - name: SSE_POLL_SECONDS
    value: '1.0'
  - name: SSE_BUFFER_SECONDS
    value: '2'
  - name: OPS_VS_ENDPOINT_ALWAYS_ON
    value: 'true'
